<svg width="800" height="84" viewBox="0 0 800 84" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="winClip">
      <rect width="800" height="84" rx="8"/>
    </clipPath>

    <style><![CDATA[
      /* Set on `text` itself, not a wrapper class: the font has to reach the
         text nodes. No webfont @import — GitHub renders README SVGs as images,
         which cannot fetch external resources, so only locally installed
         fonts render. Consolas is the Windows Terminal / VS Code default. */
      text {
        font-family: Consolas, 'Cascadia Mono', 'Fira Code', 'Courier New', monospace;
        font-size: 14px;
      }

      .tabname { font-size: 12px; fill: #c9d1d9; }
      .dim     { fill: #6e7681; }
      .path    { fill: #8b949e; }
      .cmd     { fill: #f0f6fc; }
      .out     { fill: #c9d1d9; }

      .chrome  { stroke: #8b949e; stroke-width: 1.2; fill: none; }

      .cursor { fill: #f0f6fc; animation: blink 1s step-end infinite; }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0; }
      }

      .line1 { animation: fadeIn 0.5s ease forwards; opacity: 0; }
      .line2 { animation: fadeIn 0.5s 0.8s ease forwards; opacity: 0; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateX(-8px); }
        to   { opacity: 1; transform: translateX(0); }
      }
    ]]></style>
  </defs>

  <g clip-path="url(#winClip)">
    <rect width="800" height="84" fill="#0d1117"/>

    <!-- Title bar -->
    <rect width="800" height="28" fill="#161b22"/>

    <!-- Active editor tab -->
    <rect x="8" y="0" width="132" height="28" fill="#0d1117"/>
    <rect x="8" y="0" width="132" height="2" fill="#8b949e"/>
    <text x="22" y="18" class="tabname">whoami.ps1</text>

    <!-- Windows-style caption buttons: minimise, maximise, close -->
    <path class="chrome" d="M722 14 h12"/>
    <rect class="chrome" x="748" y="8" width="12" height="12"/>
    <path class="chrome" d="M774 8 l12 12 M786 8 l-12 12"/>
  </g>

  <!-- Prompt line: tspan dx spacing avoids hand-computed x offsets -->
  <g class="line1">
    <text x="20" y="54">
      <tspan class="dim">PS</tspan>
      <tspan class="path" dx="8">C:\Users\akira&gt;</tspan>
      <tspan class="cmd" dx="8">whoami</tspan>
    </text>
  </g>

  <!-- Output line -->
  <g class="line2">
    <text x="20" y="74" class="out">CS Student · Azure Certified · Building things that work</text>
    <rect x="492" y="63" width="8" height="13" class="cursor"/>
  </g>

  <rect x="0.5" y="0.5" width="799" height="83" rx="8" fill="none" stroke="#21262d"/>
</svg>
