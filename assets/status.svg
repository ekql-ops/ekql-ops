<svg width="800" height="50" viewBox="0 0 800 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .label { font-family: 'Fira Code', monospace; font-size: 12px; fill: #4a4a4a; }
      .value { font-family: 'Fira Code', monospace; font-size: 12px; fill: #e0e0e0; }
      .tag   { font-family: 'Fira Code', monospace; font-size: 11px; fill: #8b949e; }

      .item1 { animation: appear 0.4s 0.2s ease both; opacity: 0; }
      .item2 { animation: appear 0.4s 0.5s ease both; opacity: 0; }
      .item3 { animation: appear 0.4s 0.8s ease both; opacity: 0; }

      @keyframes appear {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </defs>

  <rect width="800" height="50" fill="#0d1117" rx="6"/>
  <rect x="0" y="0" width="3" height="50" fill="#3a3a3a" rx="2"/>

  <g class="item1">
    <text x="18" y="18" class="label">status</text>
    <text x="80" y="18" class="value">·  open to placements &amp; part-time roles</text>
  </g>
  <g class="item2">
    <text x="18" y="33" class="label">studying</text>
    <text x="80" y="33" class="value">·  Spring Boot  /  Docker</text>
  </g>
  <g class="item3">
    <text x="18" y="47" class="label">location</text>
    <text x="80" y="47" class="value">·  Manchester, UK</text>
  </g>
</svg>
